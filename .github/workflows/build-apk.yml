name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # The runner image already ships an Android SDK; only add what is missing.
      - name: Ensure Android SDK platform 35
        shell: bash
        run: |
          set -e
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          echo "ANDROID SDK: $SDK"
          ls "$SDK" || true
          if [ -d "$SDK/platforms/android-35" ]; then
            echo "platform 35 already installed"
            exit 0
          fi
          SDKM="$(command -v sdkmanager || true)"
          if [ -z "$SDKM" ] && [ -x "$SDK/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          fi
          echo "sdkmanager: $SDKM"
          yes | "$SDKM" --licenses > /dev/null 2>&1 || true
          "$SDKM" "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MashAllahBilling-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
